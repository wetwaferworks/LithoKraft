<!doctype html><meta charset="utf-8"><title>LithoKraft (lkboot)</title>
<!-- Smoke page: serve wasm/lkboot with COOP same-origin + COEP require-corp and put the
     built module next to this file as LithoKraft.wasm. The engine runs in a worker and
     draws into this canvas through an OffscreenCanvas. -->
<style>html,body{margin:0;background:#000}canvas{width:960px;height:540px;display:block}</style>
<div id="wrap" style="position:relative;width:960px;height:540px"><canvas id="canvas" width="960" height="540"></canvas></div>
<script src="../touch.js"></script>
<script type="module">
import { makeChannel } from '../lkstore.mjs';
import { lkPageAttach } from '../lkpage.mjs';
const memory = new WebAssembly.Memory({ initial: 4096, maximum: 9600, shared: true });
const channel = makeChannel();
const store = new Worker(new URL('../lkthread.mjs', import.meta.url), { type: 'module' });
const Q = new URLSearchParams(location.search);
store.postMessage({ lkKind: 'store', backend: Q.get('store') || 'opfs', memory, channel, packUrl: Q.has('nopack') ? null : new URL('./LithoKraft.lkp2', import.meta.url).href });
const storeReady = new Promise(res => store.onmessage = e => { if ('storeReady' in e.data) { console.log('KRAFT store ' + JSON.stringify(e.data)); res(e.data); } });
const main = new Worker(new URL('../lkthread.mjs', import.meta.url), { type: 'module' });
const page = lkPageAttach(document.getElementById('canvas'), main);
window.__kraft = null;
window.__klog = [];
main.onmessage = e => { if (e.data.kraftLog) { if (window.__klog.length < 6000) window.__klog.push(e.data.kraftLog); return; } if (e.data.kraft) { window.__kraft = e.data.kraft; console.log('KRAFT ' + JSON.stringify(e.data.kraft).slice(0, 3000)); } else page.onMessage(e.data); };
main.onerror = e => console.log('KRAFT worker error ' + e.message);
await storeReady;
main.postMessage({ lkKind: 'kraft', url: new URL('./LithoKraft.wasm', import.meta.url).href, memory, channel, cpuCount: 4, pool: Number(Q.get('pool') || 12),
  liveLog: Q.has('livelog'), glSlowMs: Number(Q.get('glslow') || 0), glSync: Q.has('glsync'), glBig: Number(Q.get('glbig') || 0), mega: Q.has('mega'), canvas: page.offscreen, search: location.search, argv: ['LithoKraft', ...(Q.get('args') ?? '').split(' ').filter(Boolean)] }, [page.offscreen]);
</script>
